<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23007aff'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8'%3E%3Ccircle cx='12' cy='12' r='7'/%3E%3Cpath d='M5 12h14M12 5c2 2 3 4.3 3 7s-1 5-3 7c-2-2-3-4.3-3-7s1-5 3-7z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f5f7; --surface: rgba(255,255,255,.82); --surface-solid: #fff; --elev: #fbfbfd;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6; --hair: rgba(0,0,0,.08);
    --blue: #007aff; --blue-soft: rgba(0,122,255,.1); --green: #34c759; --green-soft: rgba(52,199,89,.14);
    --red: #ff3b30; --red-soft: rgba(255,59,48,.1); --orange: #ff9500;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.05), 0 18px 40px rgba(0,0,0,.10);
    --spring: cubic-bezier(.2,.9,.25,1.15); --ease: cubic-bezier(.25,.1,.25,1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: rgba(28,28,30,.82); --surface-solid: #1c1c1e; --elev: #2c2c2e;
      --text: #f5f5f7; --text-2: #98989d; --text-3: #636366; --hair: rgba(255,255,255,.1);
      --blue: #0a84ff; --blue-soft: rgba(10,132,255,.18); --green: #30d158; --green-soft: rgba(48,209,88,.16);
      --red: #ff453a; --red-soft: rgba(255,69,58,.16); --orange: #ff9f0a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    letter-spacing: -.01em; min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 1px solid var(--hair);
  }
  .bar { max-width: 1080px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none;
    background: linear-gradient(145deg, #5ac8fa, #007aff 55%, #5856d6); color: #fff; box-shadow: 0 4px 12px rgba(0,122,255,.35);
  }
  .bar h1 { font: 600 19px/1.2 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; margin: 0; }
  .bar .meta { color: var(--text-2); font-size: 13px; }
  .bar .spacer { flex: 1; }

  main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 120px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: 980px; border: 0; cursor: pointer;
    background: var(--elev); color: var(--text); font-weight: 500; font-size: 14px;
    transition: transform .25s var(--spring), background .2s var(--ease), opacity .2s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent; white-space: nowrap;
  }
  .btn:hover { background: color-mix(in srgb, var(--elev) 80%, var(--text) 8%); }
  .btn:active { transform: scale(.95); }
  .btn:focus-visible { outline: 3px solid var(--blue-soft); outline-offset: 2px; }
  .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 2px 8px color-mix(in srgb, var(--blue) 35%, transparent); }
  .btn.primary:hover { background: color-mix(in srgb, var(--blue) 88%, #000); }
  .btn.danger { background: transparent; color: var(--red); padding: 0 10px; }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.danger.armed { background: var(--red); color: #fff; }
  .btn.ghost { background: transparent; color: var(--blue); padding: 0 10px; }
  .btn.ghost:hover { background: var(--blue-soft); }
  .btn.icon { width: 34px; padding: 0; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .btn .spin {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- profile grid ---------- */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 14px; }
  .section-head h2 { font: 600 22px/1.2 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; margin: 0; }
  .section-head span { color: var(--text-2); font-size: 13px; text-align: right; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

  .card {
    position: relative; background: var(--surface-solid); border-radius: 18px; padding: 18px 18px 16px;
    box-shadow: var(--shadow); border: 1px solid var(--hair);
    transition: transform .35s var(--spring), box-shadow .35s var(--ease);
    animation: enter .5s var(--spring) both;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .card.leaving { animation: leave .3s var(--ease) forwards; }
  @keyframes enter { from { opacity: 0; transform: translateY(12px) scale(.97); } }
  @keyframes leave { to { opacity: 0; transform: scale(.94); } }

  .card-top { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none;
    font: 600 18px/1 -apple-system, sans-serif; color: #fff; text-transform: uppercase;
  }
  .card-title { min-width: 0; flex: 1; }
  .card-title strong { display: block; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-title small { color: var(--text-2); font-size: 13px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 980px;
    font-size: 12px; font-weight: 500; background: var(--elev); color: var(--text-2);
    transition: background .3s var(--ease), color .3s var(--ease);
  }
  .pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); transition: background .3s; }
  .pill.on { background: var(--green-soft); color: var(--green); }
  .pill.on .led { background: var(--green); animation: pulse 2s ease-in-out infinite; }
  .pill.busy { background: var(--blue-soft); color: var(--blue); }
  .pill.busy .led { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }

  .rows { margin: 16px 0 14px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; min-height: 22px; }
  .row .k { width: 22px; text-align: center; color: var(--text-3); flex: none; }
  .row .v { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .v.muted { color: var(--text-2); }
  .exit { transition: opacity .3s; }
  .exit.fresh { animation: flash 1s var(--ease); }
  @keyframes flash { from { background: var(--blue-soft); } to { background: transparent; } }

  .actions { display: flex; gap: 4px; align-items: center; padding-top: 14px; border-top: 1px solid var(--hair); }
  .actions .grow { flex: 1; }

  /* ---------- empty state ---------- */
  .empty {
    text-align: center; padding: 64px 24px; background: var(--surface-solid); border-radius: 22px;
    border: 1px dashed var(--hair); animation: enter .5s var(--spring) both;
  }
  .empty .big { font-size: 44px; margin-bottom: 8px; }
  .empty p { color: var(--text-2); margin: 6px 0 18px; }

  /* ---------- tunnels ---------- */
  .tunnels { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--text-2); font-size: 13px; }
  .tunnel { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 980px; background: var(--surface-solid); border: 1px solid var(--hair); animation: enter .4s var(--spring) both; }
  .tunnel code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-2); }

  /* ---------- sheet ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none;
    transition: opacity .3s var(--ease); backdrop-filter: blur(2px);
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; z-index: 31; left: 50%; top: 50%; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto;
    background: var(--surface); backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
    border-radius: 22px; border: 1px solid var(--hair); box-shadow: 0 30px 80px rgba(0,0,0,.25);
    transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none;
    transition: transform .45s var(--spring), opacity .25s var(--ease);
  }
  .sheet.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .sheet-head { display: flex; align-items: center; padding: 18px 20px 8px; }
  .sheet-head h3 { margin: 0; flex: 1; font: 600 18px/1.3 -apple-system, "SF Pro Display", sans-serif; }
  .sheet form { padding: 4px 20px 20px; }

  .group { background: var(--surface-solid); border-radius: 12px; border: 1px solid var(--hair); margin: 12px 0; overflow: hidden; }
  .field { display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 46px; }
  .field + .field { border-top: 1px solid var(--hair); }
  .field label { width: 120px; flex: none; color: var(--text); font-size: 14px; }
  .field input, .field select {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none; text-align: right; padding: 12px 0;
    color: var(--text-2);
  }
  .field input:focus { color: var(--text); }
  .field input::placeholder { color: var(--text-3); }
  .field select { appearance: none; -webkit-appearance: none; cursor: pointer; text-align-last: right; }
  .field.select::after { content: "⌃⌄"; font-size: 10px; color: var(--text-3); letter-spacing: -2px; writing-mode: vertical-lr; }
  .hint { color: var(--text-2); font-size: 12px; margin: -4px 4px 8px; }
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--spring); }
  .collapse.show { grid-template-rows: 1fr; }
  .collapse > div { overflow: hidden; min-height: 0; }
  .collapse .group { margin: 0 0 12px; }

  .segmented {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--elev);
    border-radius: 10px; padding: 3px; margin: 12px 0;
  }
  .segmented .thumb {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 8px;
    background: var(--surface-solid); box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0 0 .5px var(--hair);
    transition: transform .4s var(--spring);
  }
  .segmented button {
    position: relative; z-index: 1; border: 0; background: transparent; padding: 7px 0; font-size: 13px; font-weight: 500;
    cursor: pointer; color: var(--text-2); transition: color .2s;
  }
  .segmented button.active { color: var(--text); }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .err-line { color: var(--red); font-size: 13px; min-height: 18px; margin: 8px 4px 0; }

  /* ---------- toasts ---------- */
  .toasts { position: fixed; z-index: 40; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .toast {
    display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 980px; font-size: 14px; font-weight: 500;
    background: var(--surface); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid var(--hair); box-shadow: var(--shadow-lift); max-width: min(560px, calc(100vw - 32px));
    animation: toast-in .45s var(--spring) both;
  }
  .toast.out { animation: toast-out .3s var(--ease) forwards; }
  .toast .ico { font-size: 16px; }
  .toast.err .ico { color: var(--red); } .toast.ok .ico { color: var(--green); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(16px) scale(.95); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(8px) scale(.97); } }

  @media (max-width: 560px) {
    .bar { padding: 12px 16px; } main { padding: 20px 16px 120px; }
    .bar .meta { display: none; }
    .section-head { flex-direction: column; align-items: flex-start; gap: 4px; }
    .section-head span { text-align: left; }
    .grid { grid-template-columns: 1fr; }
    .field label { width: 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
    </div>
    <div>
      <h1>Browser Manager</h1>
      <div class="meta" id="summary">Đang tải…</div>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="add-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Profile mới
    </button>
  </div>
</header>

<main>
  <div class="section-head"><h2>Profiles</h2><span>Mỗi profile là một Chrome riêng: cookie, đăng nhập, mạng riêng</span></div>
  <div id="grid" class="grid"></div>
  <div id="tunnels" class="tunnels"></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-head">
    <h3 id="sheet-title">Profile mới</h3>
    <button class="btn icon" type="button" id="close-sheet" aria-label="Đóng">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <form id="form" autocomplete="off">
    <div class="group">
      <div class="field"><label for="f-name">Tên</label><input id="f-name" name="pname" required pattern="[a-z0-9][a-z0-9-]{0,39}" placeholder="vd: test-us"></div>
      <div class="field"><label for="f-note">Ghi chú</label><input id="f-note" name="note" maxlength="200" placeholder="Không bắt buộc"></div>
    </div>
    <div class="hint">Tên chỉ gồm chữ thường, số và dấu gạch ngang.</div>

    <div class="segmented" id="mode">
      <span class="thumb"></span>
      <button type="button" data-mode="direct">Trực tiếp</button>
      <button type="button" data-mode="vpn">VPN</button>
      <button type="button" data-mode="custom">Proxy riêng</button>
    </div>
    <div class="collapse" id="vpn-box"><div>
      <div class="group"><div class="field select"><label for="f-vpn">Máy chủ VPN</label><select id="f-vpn" name="vpn"></select></div></div>
      <div class="hint">Thêm máy chủ: tải file WireGuard .conf vào ~/.config/protonvpn hoặc ~/.config/surfshark.</div>
    </div></div>
    <div class="collapse" id="custom-box"><div>
      <div class="group"><div class="field"><label for="f-proxy">Địa chỉ</label><input id="f-proxy" name="custom_proxy" placeholder="socks5://127.0.0.1:1080"></div></div>
    </div></div>

    <div class="group">
      <div class="field"><label for="f-tz">Múi giờ</label><input id="f-tz" name="timezone" list="tz-list" placeholder="auto"></div>
      <div class="field"><label for="f-locale">Ngôn ngữ</label><input id="f-locale" name="locale" list="locale-list" placeholder="en-US"></div>
      <div class="field"><label for="f-url">Trang mở đầu</label><input id="f-url" name="start_url" placeholder="about:blank"></div>
    </div>
    <div class="hint">Múi giờ "auto" tự lấy theo IP của proxy.</div>
    <datalist id="tz-list">
      <option value="auto"><option value="America/New_York"><option value="America/Chicago"><option value="America/Denver">
      <option value="America/Los_Angeles"><option value="Europe/London"><option value="Europe/Berlin"><option value="Asia/Tokyo"><option value="Asia/Ho_Chi_Minh">
    </datalist>
    <datalist id="locale-list"><option value="en-US"><option value="en-GB"><option value="vi-VN"><option value="ja-JP"><option value="de-DE"></datalist>

    <div class="err-line" id="form-err"></div>
    <div class="sheet-actions">
      <button class="btn" type="button" id="cancel">Huỷ</button>
      <button class="btn primary" type="submit" id="save">Lưu</button>
    </div>
  </form>
</div>

<div class="toasts" id="toasts"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const PALETTE = ["#ff9500", "#ff2d55", "#af52de", "#5856d6", "#007aff", "#32ade6", "#34c759", "#a2845e"];
const busy = new Map();     // name -> "start" | "stop" | "ip"
const exits = new Map();    // name -> exit info from last IP check
const cards = new Map();    // name -> card element
let state = { profiles: [], vpn_configs: [], proxies: [] };

/* ---------- helpers ---------- */
async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "X-BM": "1", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  node.append(...children.filter((c) => c !== null && c !== undefined));
  return node;
}

const colorFor = (name) => PALETTE[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTE.length];
const flag = (cc) => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 127397 + c.charCodeAt(0))) : "🌐";

function proxyLabel(proxy) {
  if (!proxy) return "Kết nối trực tiếp";
  const m = proxy.match(/^vpn:([a-z]+)\/(.+)\.conf$/);
  if (!m) return proxy;
  const provider = { protonvpn: "Proton VPN", surfshark: "Surfshark" }[m[1]] || m[1];
  return `${provider} · ${m[2].toUpperCase()}`;
}

function toast(text, kind = "ok") {
  const node = h("div", { class: `toast ${kind}` }, h("span", { class: "ico" }, kind === "ok" ? "✓" : "!"), h("span", {}, text));
  $("#toasts").append(node);
  setTimeout(() => { node.classList.add("out"); node.addEventListener("animationend", () => node.remove()); }, kind === "ok" ? 2600 : 5000);
}

/* ---------- actions ---------- */
async function act(name, kind, fn, okText) {
  busy.set(name, kind); render();
  try { await fn(); if (okText) toast(okText); }
  catch (error) { toast(error.message, "err"); }
  finally { busy.delete(name); await refresh(true); }
}

const startProfile = (p) => act(p.name, "start", () => api("POST", `/api/profiles/${p.name}/start`), `Đã mở ${p.name}`);
const stopProfile = (p) => act(p.name, "stop", () => api("POST", `/api/profiles/${p.name}/stop`), `Đã đóng ${p.name}`);
const checkIp = (p) => act(p.name, "ip", async () => {
  exits.set(p.name, { ...(await api("POST", `/api/profiles/${p.name}/ip`)).exit, fresh: true });
});

function armDelete(btn, p) {
  if (btn.classList.contains("armed")) {
    const card = cards.get(p.name);
    card?.classList.add("leaving");
    act(p.name, "delete", () => api("DELETE", `/api/profiles/${p.name}`), `Đã xoá ${p.name} (dữ liệu Chrome vẫn giữ trên ổ)`);
    return;
  }
  btn.classList.add("armed"); btn.textContent = "Xoá thật?";
  setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Xoá"; }, 3000);
}

/* ---------- rendering ---------- */
function statusPill(p) {
  const kind = busy.get(p.name);
  if (kind === "start") return h("span", { class: "pill busy" }, h("span", { class: "led" }), "Đang mở…");
  if (kind === "stop") return h("span", { class: "pill busy" }, h("span", { class: "led" }), "Đang đóng…");
  if (p.running) return h("span", { class: "pill on" }, h("span", { class: "led" }), "Đang chạy");
  return h("span", { class: "pill" }, h("span", { class: "led" }), "Đã tắt");
}

function exitRow(p) {
  const info = exits.get(p.name);
  if (busy.get(p.name) === "ip") return h("span", { class: "v muted" }, "Đang kiểm tra IP…");
  if (!info) return h("span", { class: "v muted" }, "Chưa kiểm IP");
  const text = `${flag(info.country)}  ${info.ip} · ${[info.city, info.country].filter(Boolean).join(", ")}`;
  const node = h("span", { class: "v exit" + (info.fresh ? " fresh" : ""), title: info.org || "" }, text);
  info.fresh = false;
  return node;
}

function spinnerBtn(label, cls, isBusy, onclick, disabled) {
  return h("button", { class: `btn ${cls}`, onclick, ...(disabled || isBusy ? { disabled: "" } : {}) },
    isBusy ? h("span", { class: "spin" }) : null, label);
}

function cardBody(p) {
  const kind = busy.get(p.name);
  const locked = !!kind || p.running;
  const delBtn = h("button", { class: "btn danger", ...(locked ? { disabled: "" } : {}) }, "Xoá");
  delBtn.onclick = () => armDelete(delBtn, p);
  const main = p.running
    ? spinnerBtn("Đóng", "", kind === "stop", () => stopProfile(p), !!kind)
    : spinnerBtn("Mở Chrome", "primary", kind === "start", () => startProfile(p), !!kind);
  return [
    h("div", { class: "card-top" },
      h("div", { class: "avatar", style: `background:${colorFor(p.name)}` }, p.name[0]),
      h("div", { class: "card-title" }, h("strong", {}, p.name), h("small", {}, p.note || "Không có ghi chú")),
      statusPill(p)),
    h("div", { class: "rows" },
      h("div", { class: "row" }, h("span", { class: "k" }, p.proxy ? "🔒" : "↗︎"), h("span", { class: "v" }, proxyLabel(p.proxy))),
      h("div", { class: "row" }, h("span", { class: "k" }, "🕒"),
        h("span", { class: "v muted" }, `${p.timezone === "auto" ? "Múi giờ tự động" : p.timezone} · ${p.locale}`)),
      h("div", { class: "row" }, h("span", { class: "k" }, "📍"), exitRow(p))),
    h("div", { class: "actions" },
      main,
      spinnerBtn("Kiểm IP", "ghost", kind === "ip", () => checkIp(p), !!kind),
      h("span", { class: "grow" }),
      h("button", { class: "btn ghost", onclick: () => openSheet(p), ...(locked ? { disabled: "" } : {}) }, "Sửa"),
      delBtn),
  ];
}

function render() {
  const grid = $("#grid");
  const names = new Set(state.profiles.map((p) => p.name));
  for (const [name, card] of cards) {
    if (!names.has(name)) { card.classList.add("leaving"); card.addEventListener("animationend", () => card.remove()); cards.delete(name); }
  }
  grid.querySelector(".empty")?.remove();
  if (!state.profiles.length) {
    grid.append(h("div", { class: "empty", style: "grid-column:1/-1" },
      h("div", { class: "big" }, "🧭"), h("strong", {}, "Chưa có profile nào"),
      h("p", {}, "Tạo một profile để mở Chrome riêng, đi qua VPN hoặc proxy của bạn."),
      h("button", { class: "btn primary", onclick: () => openSheet() }, "Tạo profile đầu tiên")));
  }
  let prev = null;
  state.profiles.forEach((p, index) => {
    let card = cards.get(p.name);
    if (!card) {
      // Only new cards are inserted; moving existing nodes would replay their enter animation.
      card = h("article", { class: "card", style: `animation-delay:${Math.min(index, 8) * 40}ms` });
      cards.set(p.name, card);
      prev ? prev.after(card) : grid.prepend(card);
    }
    card.replaceChildren(...cardBody(p));
    prev = card;
  });
  renderHeader();
}

function renderHeader() {
  const running = state.profiles.filter((p) => p.running).length;
  $("#summary").textContent = `${state.profiles.length} profile · ${running} đang chạy · ${state.vpn_configs.length} máy chủ VPN`;
  const box = $("#tunnels");
  box.replaceChildren(...(state.proxies.length
    ? [h("span", {}, "Đường hầm đang mở:"), ...state.proxies.map((t) =>
        h("span", { class: "tunnel" }, h("span", { class: "pill on" }, h("span", { class: "led" }), proxyLabel(t.key)), h("code", {}, `127.0.0.1:${t.port}`)))]
    : []));
}

let lastSnapshot = "";
async function refresh(force = false) {
  try {
    const next = await api("GET", "/api/state");
    const snapshot = JSON.stringify(next);
    state = next;
    // Skip identical polls so the "Xoá thật?" confirm and focus are not reset.
    if (force || snapshot !== lastSnapshot) { lastSnapshot = snapshot; render(); }
  }
  catch (error) { $("#summary").textContent = "Mất kết nối tới manager — hãy chạy lại start.command"; }
}

/* ---------- sheet ---------- */
let mode = "direct";
let editing = ""; // original name of the profile being edited, "" when creating
function setMode(next) {
  mode = next;
  const buttons = [...document.querySelectorAll("#mode button")];
  const index = buttons.findIndex((b) => b.dataset.mode === next);
  buttons.forEach((b, i) => b.classList.toggle("active", i === index));
  $("#mode .thumb").style.transform = `translateX(${index * 100}%)`;
  $("#vpn-box").classList.toggle("show", next === "vpn");
  $("#custom-box").classList.toggle("show", next === "custom");
}
document.querySelectorAll("#mode button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));

function fillVpnSelect(selected) {
  const select = $("#f-vpn");
  select.replaceChildren(...state.vpn_configs.map((key) => h("option", { value: key }, proxyLabel(key))));
  if (!state.vpn_configs.length) select.append(h("option", { value: "" }, "Chưa có file .conf nào"));
  if (selected) select.value = selected;
}

function openSheet(p) {
  const f = $("#form");
  f.reset(); $("#form-err").textContent = "";
  $("#sheet-title").textContent = p ? `Sửa ${p.name}` : "Profile mới";
  f.pname.value = p?.name || ""; editing = p?.name || "";
  f.note.value = p?.note || "";
  f.timezone.value = p?.timezone || "auto";
  f.locale.value = p?.locale || "en-US";
  f.start_url.value = p?.start_url || "about:blank";
  const proxy = p?.proxy || "";
  fillVpnSelect(proxy.startsWith("vpn:") ? proxy : state.vpn_configs[0]);
  f.custom_proxy.value = proxy && !proxy.startsWith("vpn:") ? proxy : "";
  setMode(!p ? (state.vpn_configs.length ? "vpn" : "direct") : !proxy ? "direct" : proxy.startsWith("vpn:") ? "vpn" : "custom");
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
  setTimeout(() => f.pname.focus(), 250);
}

function closeSheet() { $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }

$("#add-btn").onclick = () => openSheet();
$("#close-sheet").onclick = closeSheet;
$("#cancel").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeSheet();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") { e.preventDefault(); openSheet(); }
});

$("#form").onsubmit = async (event) => {
  event.preventDefault();
  const f = event.target;
  const proxy = mode === "vpn" ? f.vpn.value : mode === "custom" ? f.custom_proxy.value.trim() : "";
  const body = {
    name: f.pname.value.trim(), rename_from: editing || undefined, proxy, note: f.note.value,
    timezone: f.timezone.value.trim() || "auto", locale: f.locale.value.trim() || "en-US",
    start_url: f.start_url.value.trim() || "about:blank",
  };
  const save = $("#save");
  save.disabled = true; save.replaceChildren(h("span", { class: "spin" }), "Đang lưu");
  try {
    await api("POST", "/api/profiles", body);
    closeSheet(); toast(`Đã lưu ${body.name}`); await refresh(true);
  } catch (error) {
    $("#form-err").textContent = error.message;
  } finally {
    save.disabled = false; save.textContent = "Lưu";
  }
};

refresh(true);
setInterval(() => { if (!busy.size) refresh(); }, 3000);
</script>
</body>
</html>
